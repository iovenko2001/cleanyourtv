name: Build launcher APK

# Personal build for this fork: builds launcher/ from source and attaches the APK to a release,
# so it can be downloaded and installed on the TV from a USB stick.
on:
  push:
    branches: [build-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk cleanyourtv-launcher.apk
          sha256sum cleanyourtv-launcher.apk
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" cleanyourtv-launcher.apk \
            --target "${{ github.sha }}" --title "Launcher APK $tag" \
            --notes "Built from ${{ github.sha }} by GitHub Actions. SHA-256: $(sha256sum cleanyourtv-launcher.apk | cut -d' ' -f1)"
